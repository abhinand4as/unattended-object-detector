[project]
name = "unattended-object-detector"
version = "0.1.0"
description = "Unattended-object detection: closed-set person detection + open-vocabulary luggage detection + BoxMOT tracking + ownership/abandonment alerts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boxmot>=22.0.0",
    "clip",
    "numpy>=1.26",
    "opencv-python>=4.7.0,<5.0.0",
    "ultralytics>=8.4.115",
]

[project.scripts]
unattended-object-detector = "unattended_object_detector.detector:main"

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
